name: Pflanzen

on:
  push:
    branches: [main]
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pflanzen
  cancel-in-progress: false

jobs:
  bauen:
    # Formulare nur von dir und Mitwirkenden verarbeiten (das Repo ist öffentlich)
    if: >-
      github.event_name != 'issues' ||
      contains(fromJSON('["OWNER","COLLABORATOR","MEMBER"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: pip install -r tools/requirements.txt

      - name: Formular übernehmen
        if: github.event_name == 'issues'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          python tools/issue.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pflanzen.json merkliste.json fotos
          git commit -m "$ISSUE_TITLE (#${{ github.event.issue.number }})"
          git push

      - name: Webseite und Etiketten bauen
        run: python tools/build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Rückmeldung im Formular
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} -R ${{ github.repository }} --body-file antwort.md
          gh issue close ${{ github.event.issue.number }} -R ${{ github.repository }}

      - name: Fehler melden
        if: failure() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} -R ${{ github.repository }} \
            --body "⚠️ Das hat nicht geklappt. Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
